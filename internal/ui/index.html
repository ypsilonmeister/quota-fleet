<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0c0d10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="quota-fleet">
  <title>quota-fleet</title>
  <link rel="manifest" href="/ui/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/ui/assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/ui/assets/apple-touch-icon.png">
  <script src="/ui/assets/direction.js"></script>
  <link rel="stylesheet" href="/ui/assets/style.css">
  <script defer src="/ui/assets/notify.js"></script>
  <!-- Served with the label dictionary in front of the application (docs/17). -->
  <script defer src="/ui/assets/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/ui/" data-nav="true">quota-fleet</a>
      <nav class="nav" aria-label="Main navigation">
        <a class="nav-link" href="/ui/" data-nav="true" data-route="dashboard" data-i18n="nav.dashboard"></a>
        <a class="nav-link" href="/ui/jobs" data-nav="true" data-route="jobs" data-i18n="nav.jobs"></a>
        <a class="nav-link" href="/ui/jobs/new" data-nav="true" data-route="new-job" data-i18n="nav.newJob"></a>
        <a class="nav-link" href="/ui/gate/held" data-nav="true" data-route="held" data-i18n="nav.held"></a>
        <a class="nav-link" href="/ui/gate/decisions" data-nav="true" data-route="decisions" data-i18n="nav.decisions"></a>
        <a class="nav-link" href="/ui/deliveries" data-nav="true" data-route="deliveries" data-i18n="nav.deliveries"></a>
        <a class="nav-link" href="/ui/agents" data-nav="true" data-route="agents" data-i18n="nav.agents"></a>
      </nav>
      <div class="topbar-actions">
        <span id="meta-badges" class="meta-badges"></span>
        <div id="locale-switch" class="direction-switch" role="group" data-i18n-aria-label="lang.switchLabel">
          <button type="button" class="direction-btn" data-set-locale="ja" aria-pressed="false" data-i18n-title="lang.jaName" data-i18n="lang.ja"></button>
          <button type="button" class="direction-btn" data-set-locale="en" aria-pressed="false" data-i18n-title="lang.enName" data-i18n="lang.en"></button>
        </div>
        <div id="direction-switch" class="direction-switch" role="group" data-i18n-aria-label="theme.switchLabel">
          <button type="button" class="direction-btn" data-set-direction="console" aria-pressed="false" data-i18n-aria-label="theme.darkLabel" data-i18n="theme.dark"></button>
          <button type="button" class="direction-btn" data-set-direction="ledger" aria-pressed="false" data-i18n-aria-label="theme.lightLabel" data-i18n="theme.light"></button>
        </div>
        <button id="btn-notify" type="button" class="btn btn-sm btn-ghost" aria-pressed="false" data-i18n-title="header.notifyTitle" data-i18n="header.notify"></button>
        <button id="btn-refresh" type="button" class="btn btn-sm" data-i18n="header.refresh"></button>
        <button id="btn-token" type="button" class="btn btn-sm btn-ghost" data-i18n="header.token"></button>
      </div>
    </div>
  </header>

  <section id="auth-gate" class="auth-gate" hidden>
    <div class="card auth-card">
      <h1 data-i18n="auth.title"></h1>
      <p class="muted" data-i18n="auth.description"></p>
      <form id="auth-form" class="form-stack">
        <label class="field">
          <span class="field-label" data-i18n="auth.tokenLabel"></span>
          <input id="auth-token-input" type="password" autocomplete="off" data-i18n-placeholder="auth.tokenPlaceholder" required>
        </label>
        <div id="auth-error" class="alert alert-error" hidden></div>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary" data-i18n="auth.connect"></button>
          <button id="btn-connect-no-auth" type="button" class="btn btn-ghost" data-i18n="auth.connectNoAuth"></button>
        </div>
      </form>
    </div>
  </section>

  <div id="banner-area" class="container banner-area" aria-live="polite"></div>

  <main id="app" class="container" aria-live="polite">
    <noscript>
      <!-- Without JavaScript nothing can be translated (docs/17). -->
      <div class="alert alert-error" lang="en">This UI requires JavaScript.</div>
    </noscript>
  </main>
</body>
</html>
